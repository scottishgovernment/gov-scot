definitions:
  config:
    /hippo:configuration/hippo:domains/users:
      jcr:primaryType: hipposys:domain
      /users:
        jcr:primaryType: hipposys:domainrule
        /groups-and-descendants:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: true
          hipposys:facet: jcr:path
          hipposys:type: Reference
          hipposys:value: /hippo:configuration/hippo:users
        /exclude-admin-user:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: false
          hipposys:facet: nodename
          hipposys:filter: false
          hipposys:type: Name
          hipposys:value: admin
        /exclude-pwreset-user:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: false
          hipposys:facet: nodename
          hipposys:filter: false
          hipposys:type: Name
          hipposys:value: resetpassword
      /groups:
        jcr:primaryType: hipposys:domainrule
        /exclude-admin-group:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: false
          hipposys:facet: nodename
          hipposys:filter: false
          hipposys:type: Name
          hipposys:value: admin
      /readwrite:
        jcr:primaryType: hipposys:authrole
        hipposys:groups: [useradmin, cmsadmin]
        hipposys:role: readwrite
