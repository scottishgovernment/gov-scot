definitions:
  config:
    /hippo:configuration/hippo:domains/form-publication-type:
      jcr:primaryType: hipposys:domain
      /editor:
        jcr:primaryType: hipposys:authrole
        hipposys:groups: [cmsadmin, form-publication-type-editors]
        hipposys:role: editor
      /author:
        jcr:primaryType: hipposys:authrole
        hipposys:groups: [form-publication-type-authors]
        hipposys:role: author
      /form-documents-folder:
        jcr:primaryType: hipposys:domainrule
        /include-form-documents:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: true
          hipposys:facet: jcr:path
          hipposys:filter: false
          hipposys:type: Reference
          hipposys:value: /content/documents/govscot/publications/form/
        /hide-embargo-handle:
          .meta:delete: true
        /hide-embargo-document:
          .meta:delete: true
      /form-publication-type:
        jcr:primaryType: hipposys:domainrule
        /include-form-documents:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: true
          hipposys:facet: govscot:publicationType
          hipposys:filter: false
          hipposys:type: String
          hipposys:value: form
        /hide-embargo-handle:
          .meta:delete: true
        /hide-embargo-document:
          .meta:delete: true
      /embargo:
        .meta:delete: true
