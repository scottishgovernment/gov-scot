definitions:
  config:
    /hippo:configuration/hippo:domains/groups/readwrite/hipposys:groups:
      .meta:delete: true
    /hippo:configuration/hippo:domains/groups:
      jcr:primaryType: hipposys:domain
      /current-groups:
        jcr:primaryType: hipposys:domainrule
        /nodetype-group:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: true
          hipposys:facet: nodetype
          hipposys:filter: false
          hipposys:type: Name
          hipposys:value: hipposys:group
        /include-current-groups:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: true
          hipposys:facet: nodename
          hipposys:filter: false
          hipposys:type: Name
          hipposys:value: __group__
      /readwrite:
        jcr:primaryType: hipposys:authrole
        hipposys:role: readwrite
        hipposys:groups:
          type: string
          value: [cms-admin]
      /readwrite-no-delete:
        jcr:primaryType: hipposys:authrole
        hipposys:role: readwrite-no-delete
        hipposys:groups: [cmsadmin]
      /groups:
        jcr:primaryType: hipposys:domainrule
        /groups-and-descendants:
          jcr:primaryType: hipposys:facetrule
          hipposys:equals: true
          hipposys:facet: jcr:path
          hipposys:type: Reference
          hipposys:value: /hippo:configuration/hippo:groups
