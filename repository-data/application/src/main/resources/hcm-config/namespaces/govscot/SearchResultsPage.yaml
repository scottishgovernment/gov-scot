            jcr:primaryType: hippostd:html
            hippostd:content: ''
          /govscot:blankSearchQueryMessage:
            jcr:primaryType: hippostd:html
            hippostd:content: ''
      /editor:templates:
        jcr:primaryType: editor:templateset
        /_default_:
          jcr:primaryType: frontend:plugincluster
          frontend:properties: [mode]
          frontend:references: [wicket.model, model.compareTo, engine, validator.id]
          frontend:services: [wicket.id, validator.id]
          /root:
            jcr:primaryType: frontend:plugin
            item: ${cluster.id}.field
            plugin.class: org.hippoecm.frontend.service.render.ListViewPlugin
          /title:
            jcr:primaryType: frontend:plugin
            caption: Title
            field: title
            hint: Title for the search results page
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.field
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /content:
            jcr:primaryType: frontend:plugin
            caption: Content
            field: content
            hint: Content that should appear before the search results.
            plugin.class: org.hippoecm.frontend.editor.plugins.field.NodeFieldPlugin
            wicket.id: ${cluster.id}.field
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /noResultsMessage:
            jcr:primaryType: frontend:plugin
            caption: No results message
            field: noResultsMessage
            hint: Content that is shown if no results are found
            plugin.class: org.hippoecm.frontend.editor.plugins.field.NodeFieldPlugin
            wicket.id: ${cluster.id}.field
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /blankSearchQueryMessage:
            jcr:primaryType: frontend:plugin
            caption: Blank search query message
            field: blankSearchQueryMessage
            hint: Content that is shown is no search term has been supplied
            plugin.class: org.hippoecm.frontend.editor.plugins.field.NodeFieldPlugin
            wicket.id: ${cluster.id}.field
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
              ckeditor.config.appended.json: "{\t\"toolbarGroups\": [{\t\t\"name\"\
                : \"bidi\"\t}],\t\"removeButtons\": \"ShowBlocks,Strike,Subscript,Superscript,Underline,JustifyCenter,JustifyBlock\"\
                }"
              ckeditor.config.overlayed.json:
                '{"justifyClasses":["gov_text-left","gov_text-center","gov_text-right","gov_text-justify"],"toolbarGroups":[{"name":"styles"},{"name":"basicstyles"},{"name":"cleanup"},{"name":"undo"},{"name":"listindentalign","groups":["list","align"]},{"name":"links"},{"name":"insert"},{"name":"tools"},{"name":"mygov"},{"name":"bidi"}],"disallowedContent":"*[style]{*}","extraPlugins":"language,youtube_enablejsapi,dialogadvtab2,ds_inset-text,ds_warning-text,ds_accordion,simple_tables,justify","contentsCss":["ckeditor/hippocontents.css","ckeditor/ckeditorstyle.css"],"youtube_responsive":true,"youtube_privacy":true,"youtube_disabled_fields":["chkResponsive","chkPrivacy","txtEmbed","chkOlderCode"],"extraAllowedContent":"span(stat-box__*);table[data-smallscreen];div[data-module,data-uuid,href,contenteditable];address[translate];span[lang];iframe{*}[!width,!height,!src,!frameborder,!allowfullscreen]","language_list":["en:English","gd:Gaelic (Scottish)","ru:Russian","uk:Ukrainian"]}'
          /displayDates:
            jcr:primaryType: frontend:plugin
            caption: Dispay dates?
            field: displayDates
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.field
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
          /displayLabels:
            jcr:primaryType: frontend:plugin
            caption: Display labels?
            field: displayLabels
            hint: ''
            plugin.class: org.hippoecm.frontend.editor.plugins.field.PropertyFieldPlugin
            wicket.id: ${cluster.id}.field
            /cluster.options:
              jcr:primaryType: frontend:pluginconfig
