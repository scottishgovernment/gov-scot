      /govscot:content:
        jcr:primaryType: hippostd:html
        hippostd:content: "<p>[Placeholder] The National Performance Framework sets out the kind of Scotland we want to see. It provides a vision for national wellbeing built around a shared set of values, and describes the outcomes we are working towards across our economy, society and environment.</p><p>Progress towards each outcome is tracked using a set of indicators, drawing on the best available evidence to show whether life in Scotland is improving.</p>"
